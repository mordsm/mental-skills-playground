[project]
name = "mental-skills-playground"
version = "0.1.0"
description = "Standalone backend for meta-cognitive and meta-emotional training sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

